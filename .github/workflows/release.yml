# 发布：tag 触发。先校验 tag / 清单版本 / CHANGELOG 一致，再构建多平台
# abi3 wheel 与 sdist，校验后发布到 PyPI 并创建 GitHub Release。
#
# wheel 覆盖：
#   - Linux x86_64 / aarch64（manylinux_2_28）
#   - macOS universal2（arm64 + x86_64）
#   - Windows x64
# PyO3 启用 abi3-py310，因此每个平台一个 wheel 覆盖 CPython 3.10+。
# musllinux、Windows arm64 暂未纳入矩阵；需要时在 matrix.include 中追加。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: 版本与 CHANGELOG 校验
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 只依赖标准库，不构建扩展，避免校验阶段被 Rust 编译阻塞。
      - name: 校验 tag / 清单版本 / CHANGELOG
        run: python3 scripts/check_release.py --tag "$GITHUB_REF_NAME" --released

  wheels:
    name: Wheel（${{ matrix.target }}）
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - os: macos-14
            target: universal2-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装并导入冒烟
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -c "import actant; print(actant.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  sdist:
    name: sdist
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  validate:
    name: 校验分发包
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: twine check
        run: |
          python -m pip install --upgrade pip twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: 发布到 PyPI
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/actant-engine
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # 需要先在 PyPI 配置 Trusted Publisher（owner/repo/workflow/environment）。
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    name: 创建 GitHub Release
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: 生成 Release Notes
        run: python3 scripts/check_release.py --notes > RELEASE_NOTES.md

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
