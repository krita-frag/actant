# 全量门禁 CI：每次 push/PR 在 Linux 跑完整门禁，Windows 跑编译 + pipe 路径冒烟。
#
# 设计取舍：
# - Linux 单 job 串行全量门禁（fmt → clippy → test → no-default-features → ruff →
#   mypy → pytest）：clippy/test 共享编译产物，避免按检查项拆 job 导致的重复编译；
#   失败定位靠 step 名称。
# - Windows 只做「编译 + pipe 路径冒烟」而非全量 e2e：跨节点 e2e 的稳定性尚未在
#   Windows 验证；冒烟集覆盖帧协议与 @task 单元路径。
# - 两平台均 continue-on-error: false：平台差异以显式 skip 标注（见
#   tests/python/unit/test_worker_frames.py 的 _windows_skip），不做静默容忍。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux 全量门禁
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v5

      - name: Sync Python 依赖
        run: uv sync

      - name: 构建 PyO3 扩展（maturin develop）
        run: uv run maturin develop

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy（零告警）
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test --workspace（默认特性，含 PyO3）
        run: cargo test --workspace

      - name: cargo test --no-default-features（框架构建一等公民）
        run: cargo test -p actant-core -p actant-common --no-default-features

      # TaskDispatcher 注入缝的行为验收：ClosureDispatcher 真实跑通
      # 提交 → DAG → 执行 → 聚合，而不只是被编译过。对应扩展点清单
      # 中 task_dispatcher 的 acceptance_test，门禁会校验本步骤存在。
      - name: Rust 嵌入示例（TaskDispatcher 注入缝行为验收）
        run: cargo run --no-default-features --example rust_embed

      # 框架构建是一等公民：纯 Rust（无 PyO3）构建的告警必须为零。
      # 与上面的默认特性 clippy 分开跑——后者开启 python feature，覆盖不到本路径
      # （历史上正是此盲区让 AddNodeOutcome 的 cfg 泄漏以告警形式潜伏）。
      - name: cargo clippy --no-default-features（框架构建零告警）
        run: cargo clippy -p actant-core -p actant-common --no-default-features --all-targets -- -D warnings

      # 框架一致性门禁：第 1 层（runtime/common）不得依赖绑定层（py）。
      # 当前已满足；门禁用于防止边界随时间腐蚀。
      - name: 框架边界门禁（runtime/common 零 crate::py 引用）
        run: |
          if grep -rn "crate::py" crates --include='*.rs'; then
            echo "::error::框架边界腐蚀：src/runtime 或 src/common 出现 crate::py 引用（第 1 层不得依赖绑定层）"
            exit 1
          fi
          echo "OK: runtime/common 无 crate::py 引用"

      - name: ruff
        run: uv run ruff check actant tests/python benches/ extensions/act-ext-testkit

      - name: mypy
        run: uv run mypy actant

      - name: 生成文档一致性检查
        run: uv run python scripts/gen_api_reference.py --check

      - name: API surface 一致性检查
        run: uv run python scripts/api_surface.py --check

      - name: 文档契约测试
        run: uv run pytest tests/python/unit/test_docs_contract.py -q

      - name: 文档示例冒烟与事实一致性
        run: uv run pytest tests/python/integration/test_doc_examples.py -q

      - name: 文档构建（严格模式）
        run: uv run mkdocs build --strict

      - name: pytest（并行，全量含 e2e）
        run: uv run pytest tests/python/ -n 4

      - name: pytest（act-ext-testkit dogfooding）
        run: uv run pytest extensions/act-ext-testkit/tests

  windows:
    name: Windows 编译 + pipe 路径冒烟
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v5

      - name: cargo check --all-targets（编译门禁）
        run: cargo check --all-targets

      - name: cargo test --lib --no-default-features
        run: cargo test --lib --no-default-features

      - name: Sync Python 依赖
        run: uv sync

      - name: 构建 PyO3 扩展（maturin develop）
        run: uv run maturin develop

      # Windows 平台差异：os.writev 为 POSIX 语义，test_worker_frames.py 中依赖
      # 它的用例已用 _windows_skip 显式标注；冒烟集覆盖帧协议与 @task 单元路径。
      - name: Python pipe 路径冒烟
        run: >
          uv run pytest
          tests/python/unit/test_worker_frames.py
          tests/python/unit/test_task.py
