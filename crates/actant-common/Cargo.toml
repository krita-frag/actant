[package]
name = "actant-common"
version = "0.3.0"
edition = "2021"
rust-version = "1.91"
description = "Actant 共享类型层：协议、ID、配置、wire message 与错误类型"

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
rkyv = { version = "0.8", features = ["std", "uuid-1"] }
thiserror = "2.0.18"
uuid = { version = "1.0", features = ["v4", "serde"] }
xxhash-rust = { version = "0.8", features = ["xxh3", "const_xxh3", "xxh32"] }
blake3 = "1.8.5"
subtle = "2"
data-encoding = "2.11.0"
parking_lot = "0.12"
tracing = "0.1"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
tokio = { version = "1", features = ["sync"] }
num_cpus = "1.17"
heed = { version = "0.22.1", default-features = false }

[dev-dependencies]
proptest = "1.5"
tempfile = "3.24.0"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "json"] }
serde_json = "1.0"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
