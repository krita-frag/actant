[workspace]
members = ["crates/actant-common", "crates/actant-core"]

[package]
name = "actant"
version = "0.3.0"
edition = "2021"
rust-version = "1.91"
description = "基于 Actor 模型的跨平台通用分布式任务编排引擎"

[dependencies]
actant-common = { path = "crates/actant-common" }
actant-core = { path = "crates/actant-core" }
crossbeam-channel = "0.5"
num_cpus = "1.17"
log = "0.4"
async-trait = "0.1"
futures = "0.3"
thiserror = "2.0.18"
bytes = "1.12.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
serde_json = "1.0"
data-encoding = "2.11.0"
parking_lot = "0.12"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
serde = { version = "1.0", features = ["derive", "rc"] }
rkyv = { version = "0.8", features = ["std", "uuid-1"] }
tokio = { version = "1", features = ["full", "rt-multi-thread", "macros", "time", "fs", "io-util"] }
tracing = { version = "0.1", features = ["log"] }
pyo3 = { version = "0.29", optional = true }
pyo3-log = { version = "0.13", optional = true }

[dev-dependencies]
tempfile = "3.24.0"
# auto-initialize：Rust 单元测试（cargo test，非 maturin/pytest 驱动）需自动初始化
# Python 解释器才能调用 Python::attach。生产 cdylib 由 Python 解释器加载，已初始化。
pyo3 = { version = "0.29", features = ["auto-initialize"] }

[features]
python = ["dep:pyo3", "dep:pyo3-log"]
default = ["python"]

[lib]
name = "actant"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]
